<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrossCheck - 项目首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .feature {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .feature-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .feature-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .feature-desc {
            font-size: 14px;
            opacity: 0.8;
        }

        .pages {
            display: grid;
            gap: 15px;
        }

        .page-link {
            display: block;
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .page-link:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .page-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .page-desc {
            opacity: 0.8;
            font-size: 14px;
        }

        .status {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-label {
            opacity: 0.8;
        }

        .status-value {
            font-weight: 600;
        }

        .status-ok {
            color: #10b981;
        }

        .status-pending {
            color: #f59e0b;
        }
    </style>
<link rel="stylesheet" href="/front-overrides.css"></head>
<body class="index-page">
  <main class="container"><h1>CrossCheck</h1><p class="subtitle">双模型审阅与报告指纹存证</p>
    <div class="mode-notice" id="environment">正在连接服务…</div>
    <div class="features"><div class="feature"><div class="feature-icon">🤖</div><div class="feature-title">双模型意见</div><div class="feature-desc">分别展示判断与分歧</div></div><div class="feature"><div class="feature-icon">⛓️</div><div class="feature-title">记录报告指纹</div><div class="feature-desc">明确区分本地链与公网链</div></div><div class="feature"><div class="feature-icon">🔍</div><div class="feature-title">浏览器复算</div><div class="feature-desc">导入报告，核对链上事件</div></div></div>
    <div class="pages"><a href="/submit.html" class="page-link"><div class="page-title">📝 提交审阅</div><div class="page-desc">模式由服务器配置；演示支持一致、分歧、无法判断且不发链，真实模式调用已配置模型</div></a><a href="/screen.html" class="page-link"><div class="page-title">📺 实时大屏</div><div class="page-desc">自动跟随最新任务，展示两份结果及存证状态</div></a><a href="/cert.html" class="page-link"><div class="page-title">🎫 报告与核验</div><div class="page-desc">下载、导入完整 JSON，直接从 RPC 核对指纹与事件</div></a></div>
    <div class="status"><div class="status-item"><span class="status-label">后端服务</span><span class="status-value" id="backendStatus">尚未连接</span></div><div class="status-item"><span class="status-label">存证合约</span><span class="status-value address-value" id="contractStatus">尚未读取</span></div><div class="status-item"><span class="status-label">网络</span><span class="status-value" id="chainStatus">尚未读取</span></div></div>
    <p class="home-disclaimer">双模型意见一致不等于事实成立。链上指纹固定报告版本，不代表两家模型厂商签名，也不能证明真实模型调用。</p>
  </main><script src="/vendor/protocol.js"></script><script src="/browser-shared.js"></script><script src="/index-page.js"></script>
</body>
</html>
