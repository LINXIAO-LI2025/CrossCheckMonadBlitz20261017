<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrossCheck - 大屏展示</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 24px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: white;
        }

        .status-badges {
            display: flex;
            gap: 12px;
        }

        .status-badge {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: calc(100vh - 220px);
            gap: 0;
        }

        .panel {
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .panel:first-child {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border-right: 3px solid #4c1d95;
        }

        .panel:last-child {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        }

        .panel-glow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            animation: glow 8s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        .panel-content {
            position: relative;
            z-index: 1;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .model-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .model-avatar {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
        }

        .model-details h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .model-version {
            font-size: 14px;
            opacity: 0.7;
        }

        .process-status {
            padding: 10px 20px;
            background: rgba(16, 185, 129, 0.2);
            border: 2px solid #10b981;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .verdict-display {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 32px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.5s;
        }

        .verdict-display:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .verdict-label {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .verdict-value {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 8px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .verdict-credible { color: #10b981; }
        .verdict-questionable { color: #f59e0b; }
        .verdict-not_credible { color: #ef4444; }
        .verdict-unable_to_determine { color: #9ca3af; }

        .reason-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 32px;
            line-height: 1.8;
            font-size: 18px;
            min-height: 150px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .reason-label {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .reason-text {
            font-size: 18px;
            line-height: 1.8;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 32px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-top: 2px solid rgba(255, 255, 255, 0.1);
        }

        .result-banner {
            text-align: center;
            padding: 24px 40px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: 700;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-agree {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 10px 40px rgba(16, 185, 129, 0.4);
        }

        .result-disagree {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 10px 40px rgba(239, 68, 68, 0.4);
        }

        .result-uncertain {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 10px 40px rgba(245, 158, 11, 0.4);
        }

        .loading {
            text-align: center;
            padding: 100px 50px;
            font-size: 24px;
            color: #9ca3af;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .waiting-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 24px;
        }

        .waiting-icon {
            font-size: 80px;
            opacity: 0.5;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .waiting-text {
            font-size: 24px;
            color: #9ca3af;
        }
    </style>
<link rel="stylesheet" href="/front-overrides.css"></head>
<body class="screen-page">
  <header class="header"><div class="logo-section"><a class="logo screen-link" href="/">CrossCheck 实时大屏</a></div><div class="status-badges"><div class="status-badge" id="screenEnvironment">正在连接服务…</div><div class="status-badge" id="screenConnection">等待任务</div></div><aside id="screenSubmitShare" class="screen-qr"></aside></header>
  <main id="mainContent"><div class="waiting-state"><div class="waiting-icon">⏳</div><div class="waiting-text">等待审阅任务…</div></div></main>
  <script src="/vendor/protocol.js"></script><script src="/browser-shared.js"></script><script src="/screen-page.js"></script>
</body>
</html>
